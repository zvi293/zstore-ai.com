# Zstore AI — zstore-ai.com
# Static site, no build step: the repository root is published as-is.

[build]
  publish = "."

# Serve links exactly as written (./privacy-policy.html). Netlify's "Pretty URLs" post-processing
# rewrote them to /privacy-policy, a non-canonical duplicate. This overrides the UI setting; removing
# it silently brings the rewriting back and turns every legal link into a hop through the 301s below.
[build.processing.html]
  pretty_urls = false

# Security headers are also declared per-path in _headers; netlify.toml keeps only the build config
# so there is a single source of truth for headers.

# The Netlify subdomain serves a full copy of the site: send it to the custom domain.
[[redirects]]
  from = "https://zstore-ai-com.netlify.app/*"
  to = "https://zstore-ai.com/:splat"
  status = 301
  force = true

# apps-script/ holds the server code of the contact form for versioning only — never publish it.
[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404
  force = true

# One canonical URL for the homepage: /index.html and /index collapse into /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

# The legal pages live at their .html URLs (canonical, sitemap, JSON-LD, links). Netlify also
# serves them without the extension, so fold those duplicates into the canonical URLs.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301
  force = true
